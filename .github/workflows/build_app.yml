name: Build TLS-Inspector Release IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true

jobs:
  build-release-ipa:
    runs-on: macos-26
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Xcode 26.4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
          echo "SWIFTLINT_CACHE_KEY=swiftlint_$(gh api repos/realm/swiftlint/releases/latest --jq '.assets[] | select(.name == "portable_swiftlint.zip") | .id')" >> "$GITHUB_OUTPUT"
          echo "ROOTCA=rootca_$(cat tlskit/Sources/TLSKit/External/Anchors/bundle_version.txt)" >> "$GITHUB_OUTPUT"
          echo "CT_LOGS=ctlogs_$(cat tlskit/Sources/TLSKit/External/CT-Logs/ct_log_version.txt)" >> "$GITHUB_OUTPUT"
          cat $GITHUB_OUTPUT

      - name: "Install SwiftLint"
        id: install_swiftlint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /Users/runner/bin
          SWIFTLINT_URL=$(gh api repos/realm/swiftlint/releases/latest --jq '.assets[] | select(.name == "portable_swiftlint.zip") | .browser_download_url')
          cd /Users/runner/bin
          curl -L -o swiftlint.zip "${SWIFTLINT_URL}"
          unzip swiftlint.zip
          rm swiftlint.zip LICENSE
          chmod a+x swiftlint

      - name: "Download Anchors"
        id: download_anchors
        run: |
          ./tlskit/Scripts/update-rootca-bundles.sh tlskit/Sources/TLSKit/External/Anchors

      - name: "Download CT Logs"
        id: download_ctlogs
        run: |
          ./tlskit/Scripts/update-ctlogs.sh "tlskit/Sources/TLSKit/External/CT-Logs"

      - name: "Resolve Package Dependencies"
        id: dependencies
        run: |
          echo "resolvePackageDependencies"
          xcodebuild -resolvePackageDependencies -project "tls-inspector.xcodeproj"


      - name: Archive TLS Inspector (Release, unsigned)
        run: |
          set -euo pipefail

          sed -i '' -E "s/(\t*MARKETING_VERSION *= *)[^ ;]+(;)/\1${{ github.event.inputs.version }}\2/" ./tls-inspector.xcodeproj/project.pbxproj

          xcodebuild \
            -project "tls-inspector.xcodeproj" \
            -scheme "TLS Inspector" \
            -configuration "Release" \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/TLS-Inspector.xcarchive" \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create unsigned IPA from archive
        run: |
          set -euo pipefail
          APP_PATH="$(find "$GITHUB_WORKSPACE/build/TLS-Inspector.xcarchive/Products/Applications" -maxdepth 1 -type d -name "*.app" | head -n 1)"
          test -d "$APP_PATH"
          rm -rf "$GITHUB_WORKSPACE/build/Payload"
          mkdir -p "$GITHUB_WORKSPACE/build/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/build/Payload/"
          cd "$GITHUB_WORKSPACE/build"
          zip -qry "TLS-Inspector-unsigned.ipa" "Payload"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TLS-Inspector-unsigned-ipa
          path: |
            build/TLS-Inspector-unsigned.ipa
            # build/TLS-Inspector.xcarchive
          if-no-files-found: error
